<!DOCTYPE html>
<html>
<head>
<title>Dino Run</title>

<style>
body {
text-align: center;
font-family: Arial, sans-serif;
background: lightblue;
}

#game {
width: 400px;
height: 250px;
margin: auto;
border: 3px solid black;
background: white;
position: relative;
overflow: hidden;
}

#dino {
position: absolute;
bottom: 0;
left: 50px;
font-size: 50px;
display: block;
}

#coin {
position: absolute;
bottom: 80px;
right: 20px;
font-size: 35px;
}
#cactus {
position: absolute;
bottom: 0;
left: 380px;
font-size: 40px;
}
</style>
</head>

<body>

<h1>🦖 Dino Run 🦖</h1>

<div id="score">punkte: 0</div>

<div id="game">
<div id="dino">🦖</div>
<div id="coin">🪙</div>
<div id="cactus">🌵</div>
</div>

<br>
<button id="startButton" oneclick="startGame()">▶️ spiel starten</button>
<button onclick="jump()">Springen</button>
<script>
let dino = document.getElementById("dino");
let gameStarted = false;
function startGame() {
gameStarted = true;
alert("Spiel gestartet!");
document.getElementById("startButton").style.display = "none";
}
let cactus = document.getElementById("cactus");
let cactusX = 380;

setInterval(function () {
  
  if(!gameStarted) {
    return;
  }
cactusX = cactusX - 5;

if (cactusX < -40) {
cactusX = 380;
}

cactus.style.left = cactusX + "px";
}, 30);

function jump() {
dino.style.bottom = "120px";

setTimeout(function () {

dino.style.bottom = "0px";
}, 500);
}
</script>

</body>
</html>
