<!DOCTYPE html>
<html>
<head>

<style>

}

#game {

}

#dino {
position: absolut;

}

<body>

</div>

<br>

<button onclick="jump()">Springen</button>
<script>
let dino = document.getElementById("dino");

function jump() {

setTimeout(function () {

dino.style.bottom = "0px";
}, 500);
}
</script>
