<!DOCTYPE html>
<html>
<head>
<title>Dino Run</title>

<style>
Körper {
text-align: center;
Schriftart: Arial, serifenlos;
Hintergrund: hellblau;
}

#Spiel {
Breite: 400px;
Höhe: 250px;
Rand: automatisch;
Rahmen: 3px durchgehend schwarz;
Hintergrund: weiß;
Position: relativ;
Überlauf: versteckt;
}

#dino {
Position: absolut;
bottom: 0;
left: 50px;
Schriftgröße: 50px;
}

#coin {
Position: absolut;
unten: 80px;
rechts: 20px;
Schriftgröße: 35px;
}
</style>
</head>

<body>

<h1>🦖 Dino Run 🦖</h1>

<div id="score">punkte: 0</div>

<div id="game">
<div id="dino">🦖</div>
<div id="coin">🪙</div>
</div>

<br>

<button onclick="jump()">Springen</button>
<script>
let dino = document.getElementById("dino");

function jump() {
dino.style.bottom = "120px";

setTimeout(function () {

dino.style.bottom = "0px";
}, 500);
}
</script>

</body>
</html>
